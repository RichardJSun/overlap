<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Overlap audio test</title>
    <style>
      body { font: 16px system-ui, sans-serif; background: #111; color: #eee; margin: 16px; }
      button { margin: 4px; padding: 8px 12px; }
      label { display: block; margin: 12px 0; }
      input[type="range"] { width: 240px; vertical-align: middle; }
    </style>
  </head>
  <body>
    <h1>Overlap audio</h1>
    <div id="buttons"></div>
    <label>drone(level) <input id="drone" type="range" min="0" max="1" step="0.01" value="0" /></label>
    <label>ambient(brightness) <input id="ambient" type="range" min="0" max="1" step="0.01" value="0" /></label>
    <label><input id="mute" type="checkbox" /> muted</label>
    <script type="module" src="./audio.ts"></script>
  </body>
</html>
