<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>Overlap</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1020; color: #e8ecff; overflow: hidden; }
      body { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; -webkit-tap-highlight-color: transparent; }
      #app { position: fixed; inset: 0; display: flex; }
      #app > div { flex: 1; min-width: 0; position: relative; }
      #app.split > div + div { border-left: 2px solid #2c3758; }
      @media (max-aspect-ratio: 1/1) { #app.split { flex-direction: column; } #app.split > div + div { border-left: 0; border-top: 2px solid #2c3758; } }
      canvas { display: block; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
