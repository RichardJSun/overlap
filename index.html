<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="A two-player co-op game in a city blackout. One of you walks the dark with a lantern, the other runs the grid. Light colors add." />
    <title>Overlap</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1020; color: #e8ecff; overflow: hidden; }
      body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
      ::selection { background: #ffd38a; color: #0b1020; }
      /* Safe-area insets shrink the panes, so the HUD bars never sit under a notch or home indicator. */
      #app { position: fixed; inset: 0; display: flex; box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      #app > div { flex: 1; min-width: 0; position: relative; }
      #app.split { gap: 1px; background: #2c3758; }
      #app.split > div { background: #0b1020; }
      @media (max-aspect-ratio: 1/1) { #app.split { flex-direction: column; } #app.split > div { min-height: 0; } }
      canvas { display: block; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
